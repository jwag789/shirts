<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InkSpirit Studio</title>
    <meta
      name="description"
      content="A premium t-shirt storefront built with Vue 3 for bold originals, limited drops, and wearable graphics."
    />
    <link rel="icon" type="image/png" href="/images/is-fav.png" />
    <meta name="google-site-verification" content="SDq73KqIlRKeg2G32Ke4KzNRpwgjNcE0XwL5GtEMQjY" />
    <!-- Google Tag Manager -->
    <!--
      GTM is the single tag-management entry point for this site: it owns
      loading and configuring GA4, Google Ads, and any other downstream
      pixels/tags via the GTM workspace UI. The app itself never loads
      gtag.js directly — it only pushes events onto window.dataLayer (see
      src/analytics.js), which this snippet wires up to Google's servers.
      Loaded synchronously here (Google's recommended placement) so it
      captures events fired before the Vue app finishes booting.
      No-ops safely if VITE_GTM_ID isn't set at build time.
    -->
    <script>
      ;(function (w, d, s, l, i) {
        if (!i || i.indexOf('%') === 0) return
        w[l] = w[l] || []
        w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' })
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != 'dataLayer' ? '&l=' + l : ''
        j.async = true
        j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl
        f.parentNode.insertBefore(j, f)
      })(window, document, 'script', 'dataLayer', '%VITE_GTM_ID%')
    </script>
    <!-- End Google Tag Manager -->
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=%VITE_GTM_ID%"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
    ></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
